<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LONELYY DESK · 工作台</title>
<style>
/* ===== 设计令牌（与 trend-radar / 86-savings 统一） ===== */
:root {
  --paper:#f6f6f2; --card:#ffffff;
  --ink:#141414; --dim:#8a8a86;
  --line:#e2e2dc; --hl:#ecece6;
  --black:#000; --shadow:#e0e0da;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.02) 0 1px, transparent 1px 32px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.02) 0 1px, transparent 1px 32px),
    var(--paper);
  color:var(--ink);
  font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.6;
  display:flex; flex-direction:column; min-height:100vh;
}
/* ===== 顶栏 ===== */
header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 28px;
  background:var(--card);
  border-bottom:1px solid var(--ink);
  position:relative;
}
header::after {
  content:""; position:absolute; left:0; bottom:-4px; width:100%; height:2px;
  background:var(--ink); opacity:.08;
}
.brand { display:flex; align-items:baseline; gap:14px; }
.brand h1 { font-size:20px; letter-spacing:.14em; font-weight:800; }
.brand h1 em { font-style:normal; color:var(--paper); background:var(--ink); padding:0 6px; }
.brand .en {
  font-size:10px; color:var(--dim); letter-spacing:.32em; text-transform:uppercase;
  font-family:"Courier New",monospace;
}
.nav { display:flex; gap:8px; }
.nav a {
  color:var(--dim); text-decoration:none; font-size:12px;
  border:1px solid var(--ink); padding:5px 14px;
  background:var(--card);
  box-shadow:0 3px 0 var(--shadow);
}
.nav a:hover { color:var(--ink); border-color:var(--black); }
.nav a.on { color:var(--paper); background:var(--ink); border-color:var(--ink); }
/* ===== 主区 ===== */
main {
  flex:1; display:grid;
  grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
  gap:16px; padding:20px 28px 24px;
}
.mod {
  display:flex; flex-direction:column; min-height:0;
  background:var(--card);
  border:1px solid var(--ink);
  box-shadow:0 4px 0 var(--shadow);
}
.mod-head {
  display:flex; align-items:center; gap:10px;
  padding:10px 14px;
  border-bottom:1px solid var(--ink);
  background:var(--hl);
}
.mod-head .n {
  font-family:"Courier New",monospace; font-size:11px; color:var(--dim);
  letter-spacing:.1em;
}
.mod-head .t { font-size:13px; letter-spacing:.18em; font-weight:700; }
.mod-head .st { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dim); font-family:"Courier New",monospace; }
.mod-head .st::before {
  content:""; width:7px; height:7px; background:var(--ink); border-radius:50%;
}
.mod-head .open {
  font-size:11px; color:var(--ink); text-decoration:none; letter-spacing:.1em;
  border:1px solid var(--ink); padding:2px 10px; font-family:"Courier New",monospace;
}
.mod-head .open:hover { background:var(--ink); color:var(--paper); }
.mod iframe {
  flex:1; width:100%; border:0; min-height:0;
  background:var(--paper);
}
.col { display:flex; flex-direction:column; gap:16px; min-height:0; }
.col .mod { flex:1; }
/* ===== 穿搭灵感轮播 ===== */
.fits { position:relative; flex:1; overflow:hidden; background:var(--bg2, #ecece6); min-height:0; }
.fits img {
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:top;
  opacity:0; transition:opacity .5s;
}
.fits img.on { opacity:1; }
.fits .fits-empty {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--dim); font-size:12px; font-family:"Courier New",monospace; letter-spacing:.1em;
}
.fits .cap {
  position:absolute; left:0; right:0; bottom:0;
  padding:14px 12px 8px;
  background:linear-gradient(transparent, rgba(0,0,0,.72));
  color:#fff; font-size:11px; font-family:"Courier New",monospace; letter-spacing:.08em;
  display:flex; justify-content:space-between; align-items:center;
}
.fits .cap .idx { color:#ddd; }
.fits .dots { position:absolute; top:8px; right:10px; display:flex; gap:5px; }
.fits .dots i { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.5); }
.fits .dots i.on { background:#fff; }
/* ===== 页脚 ===== */
footer {
  padding:14px 28px 26px;
  border-top:1px solid var(--line);
  font-size:11px; color:var(--dim);
  font-family:"Courier New",monospace;
  letter-spacing:.08em;
  display:flex; justify-content:space-between;
}
footer a { color:var(--dim); }
footer a:hover { color:var(--ink); }
/* ===== 响应式 ===== */
@media (max-width:820px) {
  main { grid-template-columns:1fr; }
  .mod { height:72vh; }
  .col { flex-direction:column; }
  .col .mod { height:72vh; }
  header { flex-direction:column; gap:12px; align-items:flex-start; padding:14px 16px; }
  main, footer { padding-left:16px; padding-right:16px; }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>LONELYY<em>DESK</em></h1>
    <span class="en">My Workbench · v1.1</span>
  </div>
  <nav class="nav">
    <a class="on" href="#">工作台</a>
    <a href="https://lonelyy-z.github.io/trend-radar/" target="_blank">潮流雷达 ↗</a>
    <a href="https://lonelyy-z.github.io/savings-86/" target="_blank">攒钱计划 ↗</a>
  </nav>
</header>

<main>
  <section class="mod">
    <div class="mod-head">
      <span class="n">MODULE 01</span>
      <span class="t">潮流雷达 · TREND RADAR</span>
      <span class="st">每日更新</span>
      <a class="open" href="https://lonelyy-z.github.io/trend-radar/" target="_blank">独立页 ↗</a>
    </div>
    <iframe src="https://lonelyy-z.github.io/trend-radar/" title="潮流雷达" loading="lazy"></iframe>
  </section>

  <div class="col">
    <section class="mod">
      <div class="mod-head">
        <span class="n">MODULE 02</span>
        <span class="t">攒钱计划 · SAVINGS 86</span>
        <span class="st">本地存档</span>
        <a class="open" href="https://lonelyy-z.github.io/savings-86/" target="_blank">独立页 ↗</a>
      </div>
      <iframe src="https://lonelyy-z.github.io/savings-86/" title="攒钱计划" loading="lazy"></iframe>
    </section>

    <section class="mod">
      <div class="mod-head">
        <span class="n">MODULE 03</span>
        <span class="t">穿搭灵感 · FIT INSPO</span>
        <span class="st" id="fitsDate">每日6套</span>
        <a class="open" href="https://v.douyin.com/" target="_blank">抖音 ↗</a>
      </div>
      <div class="fits" id="fits">
        <div class="fits-empty" id="fitsEmpty">今日灵感加载中…</div>
      </div>
    </section>
  </div>
</main>

<footer>
  <span>LONELYY DESK · 数据与存档在各模块独立维护</span>
  <span><a href="https://github.com/lonelyy-z" target="_blank">github.com/lonelyy-z</a></span>
</footer>

<script>
(function(){
  var box = document.getElementById("fits");
  var empty = document.getElementById("fitsEmpty");
  var MANIFEST = "https://lonelyy-z.github.io/workbench/assets/outfits/manifest.json";
  var idx = 0, timer = null;

  function render(items, date){
    if (empty) empty.remove();
    var base = "https://lonelyy-z.github.io/workbench/assets/outfits/";
    var caps = [
      "FIT 01","FIT 02","FIT 03","FIT 04","FIT 05","FIT 06"
    ];
    items.forEach(function(u, i){
      var img = document.createElement("img");
      img.src = base + u;
      img.alt = "穿搭灵感 " + (i+1);
      img.onerror = function(){ img.style.display = "none"; };
      if (i === 0) img.classList.add("on");
      box.appendChild(img);
    });
    var cap = document.createElement("div");
    cap.className = "cap";
    cap.innerHTML = '<span>' + date + ' · 街头灵感</span><span class="idx">01 / ' + items.length + '</span>';
    box.appendChild(cap);
    var dots = document.createElement("div");
    dots.className = "dots";
    items.forEach(function(_, i){
      var d = document.createElement("i");
      if (i === 0) d.classList.add("on");
      dots.appendChild(d);
    });
    box.appendChild(dots);
    var capIdx = cap.querySelector(".idx");
    var all = box.querySelectorAll("img");
    timer = setInterval(function(){
      all[idx].classList.remove("on");
      idx = (idx + 1) % all.length;
      all[idx].classList.add("on");
      capIdx.textContent = String(idx + 1).padStart(2,"0") + " / " + all.length;
      dots.querySelectorAll("i").forEach(function(d, j){ d.classList.toggle("on", j === idx); });
    }, 5000);
    document.getElementById("fitsDate").textContent = date + " · 每日6套";
  }

  fetch(MANIFEST)
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(m){
      if (m && m.items && m.items.length) render(m.items, m.date);
      else { empty.textContent = "今日灵感未更新"; }
    })
    .catch(function(){ empty.textContent = "今日灵感未更新"; });
})();
</script>

</body>
</html>
